# markdownlint-cli2 config for colleague.
# markdownlint-cli2 stops walking at the git root, so a per-user global config
# in the home directory isn't picked up from inside the repo.
# Mirrors the guildmaster / steward / teken preset for workspace consistency.

config:
  default: true
  # MD013: Line length — disabled. Prose lines wrap at the reader.
  MD013: false
  # MD060: Table pipe spacing — disabled (stylistic preference).
  MD060: false
  # MD024: Duplicate headings — allow under different parents so Keep a
  # Changelog entries can each have ### Added / ### Changed / ### Fixed.
  MD024:
    siblings_only: true

ignores:
  - "node_modules/**"
  - ".local/**"
  - ".afi/**"
  - ".teken/**"
  # The virtualenv — installed packages (e.g. the [otel] extra's opentelemetry,
  # idna) ship their own non-conformant Markdown; never lint dependencies.
  - ".venv/**"
  # Vendored skills are cited verbatim from guildmaster — do not reformat them.
  - ".claude/skills/**"
  # devague artifacts (frames, exported specs/plans) are generated verbatim from
  # the convergence engine — the auto-generated H1 mirrors the announcement
  # sentence and bodies carry bare URLs by design; treated like vendored content.
  - ".devague/**"
  - "docs/specs/**"
  - "docs/plans/**"
  # Command-template recipes under .colleague/commands/ are not prose: the body
  # is a task instruction (a leading H1 would be sent to the model) and an
  # optional `---` frontmatter block is parsed by colleague/commands.py, not by
  # a Markdown reader. Linting them as docs is a category error. The legacy
  # .convertible/ path is kept for the back-compat window.
  - ".colleague/**"
  - ".convertible/**"
  # tools/tui_sim recordings are generated verbatim by `python -m tools.tui_sim`
  # (asciinema casts + storyboards + snapshot-quad Markdown). The snapshot `.md`
  # is render_markdown() output carrying the live slash-help (`/engine <name>` →
  # MD033 inline-HTML) and the index is a generated manifest; like the .devague/
  # frames above, these are generated artifacts, not prose. The harness sources
  # and the hand-authored README under tools/tui_sim/ are still linted.
  - "tools/tui_sim/recordings/**"
