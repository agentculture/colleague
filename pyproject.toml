[project]
name = "colleague"
version = "1.37.0"
description = "Colleague is a swappable coder-agent harness that turns different models into repo workers behind one shared task contract."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
# Colleague's agent-first CLI is rendered from an imported agentfront App
# registry (the "import, don't duplicate" migration). agentfront is the ONE
# base runtime dependency: its core is pure-stdlib (zero third-party
# transitively), so the zero-deps posture holds — tests/test_zero_deps.py
# allow-lists exactly `agentfront` and asserts no other third-party leaks. The
# MCP server bonus and its `mcp` SDK ship behind the opt-in [mcp] extra below,
# never on the base path (no socket/daemon at base).
# agentfront 0.18.0 ships agentfront.taui (work-loop cockpit; agentfront#43);
# 0.20.0 ships agentfront.testing — the public consumer harness whose
# assert_surfaces_agree gate colleague's CI adopts (colleague#262 /
# agentfront#49), pinning that the CLI/MCP/HTTP/TAUI surfaces cannot drift.
dependencies = ["agentfront>=0.20.0"]

[project.urls]
Homepage = "https://github.com/agentculture/colleague"
Issues = "https://github.com/agentculture/colleague/issues"

# GPS (issue #22): OpenTelemetry is an opt-in *extra*, never a runtime dependency.
# The base install keeps `dependencies = []` (enforced by tests/test_zero_deps.py);
# colleague/telemetry/_otel.py imports these lazily, only when telemetry is
# enabled. Install with: pip install "colleague[otel]".
#
# TUI (TAUI): Rich/Textual are opt-in richer renderer deps — never base deps.
# The stdlib ANSI renderer (colleague.tui.render.ansi) works with zero extras.
# Install with: pip install "colleague[tui]".
[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
]
# The MCP server bonus: colleague registers its operations into one agentfront
# App, so `app.mcp_server()` exposes them over MCP for free (e.g. for Cowork).
# The official `mcp` SDK is opt-in — a base install binds no socket and runs no
# daemon; only `colleague mcp serve` (with this extra installed) starts the
# single-dispatch server. Pin in lockstep with the dev group below.
# Install with: pip install "colleague[mcp]"  (or: uv sync --extra mcp).
mcp = [
    "mcp>=1.28.0",
]
tui = [
    "rich>=13",
    "textual>=0.50",
]
# VOICE (senses live-presence + voice arc, task t3): operator-side mic capture +
# speaker playback deps. Opt-in — a base install carries NO audio deps; colleague
# consumes stt/tts over HTTP (colleague/voice.py) at base, and only `colleague
# talk --audio` / spoken replies need this. Install: pip install "colleague[voice]".
voice = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
# RESIDENT (appserver mode, plan task t13): colleague consumes
# agent-lifecycle's runtime as a LIBRARY EMBED — colleague.resident.appserver
# implements the Harness Protocol (start/feed_message/replies/stop) and wires
# it to a caller-supplied Transport through agent-lifecycle's Supervisor, so
# colleague can accept mesh work requests and run them as real background
# work items. Needs ONLY agent-lifecycle — no IRC wire — because the appserver
# is transport-agnostic (the caller supplies its own Transport; a real mesh
# transport for work *requests* has not shipped upstream yet — h15/PENDING —
# so this is proven against agent_lifecycle's own reference InMemoryTransport
# today). A base install stays dep-free (tests/test_zero_deps.py); this extra
# is a strict SUBSET of [culture] below (agent-lifecycle is the only package
# both need), so `pip install "colleague[culture]"` already satisfies it too.
# Install with: pip install "colleague[resident]"  (or: uv sync --extra resident).
resident = [
    "agent-lifecycle>=0.9",
]
# CULTURE (mesh-member promotion): agent-lifecycle's asyncio runtime seam
# (Transport/Presence/Harness/Supervisor) + agentirc-cli (the IRC wire) are
# opt-in *extras*, never base runtime deps — the deps colleague needs to live in
# the Culture mesh as a resident. The base install keeps `dependencies = []`
# (enforced by tests/test_zero_deps.py). colleague/resident/ imports them lazily —
# the package's import-clean core (__init__, steward) pulls nothing third-party;
# only the async seam adapters (harness/transport/supervisor/appserver) touch
# agent_lifecycle, and only when the resident actually runs.
# Install with: pip install "colleague[culture]"  (or: uv sync --extra culture).
culture = [
    "agent-lifecycle>=0.9",
    "agentirc-cli>=9.6,<10",
]

[project.scripts]
colleague = "colleague.cli:main"
clg = "colleague.cli:main"

# Engine wheels register here. The two bundled engines use the exact same
# mechanism an out-of-tree wheel would (R4): a package advertising this
# entry-point group is discovered by `colleague wheels list`.
[project.entry-points."colleague.engines"]
mock = "colleague.engines.mock:MockEngine"
vllm-openai = "colleague.engines.vllm_openai:VllmOpenAIEngine"

# Renderer wheels register here. The stdlib ANSI renderer is the default and
# ships zero-deps. External Rich/Textual renderer wheels will register here to
# replace or augment the built-in. The entry-point name is the renderer key
# used to select it at runtime (e.g. "ansi", "rich", "textual").
[project.entry-points."colleague.renderers"]
ansi = "colleague.tui.render.ansi:render"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["colleague"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    # The [mcp] extra, installed in dev/CI so the MCP round-trip + lazy-import
    # guard run. The base package never imports mcp on its own path; this only
    # affects the dev environment. Keep the pin in lockstep with the [mcp] extra.
    "mcp>=1.28.0",
    # The [otel] extra, installed in dev/CI so the telemetry tests run. The base
    # package keeps zero runtime deps; this only affects the dev environment.
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
]

[tool.coverage.run]
source = ["colleague"]
omit = ["colleague/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=colleague (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["colleague"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
