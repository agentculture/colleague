[project]
name = "convertible-cli"
version = "0.24.0"
description = "Convertible CLI is a swappable coder-agent harness that turns different models into repo workers behind one shared task contract."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/agentculture/convertible"
Issues = "https://github.com/agentculture/convertible/issues"

# GPS (issue #22): OpenTelemetry is an opt-in *extra*, never a runtime dependency.
# The base install keeps `dependencies = []` (enforced by tests/test_zero_deps.py);
# convertible/telemetry/_otel.py imports these lazily, only when telemetry is
# enabled. Install with: pip install "convertible-cli[otel]".
#
# TUI (TAUI): Rich/Textual are opt-in richer renderer deps — never base deps.
# The stdlib ANSI renderer (convertible.tui.render.ansi) works with zero extras.
# Install with: pip install "convertible-cli[tui]".
[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
]
tui = [
    "rich>=13",
    "textual>=0.50",
]

[project.scripts]
convertible = "convertible.cli:main"

# Engine wheels register here. The two bundled engines use the exact same
# mechanism an out-of-tree wheel would (R4): a package advertising this
# entry-point group is discovered by `convertible wheels list`.
[project.entry-points."convertible.engines"]
mock = "convertible.engines.mock:MockEngine"
vllm-openai = "convertible.engines.vllm_openai:VllmOpenAIEngine"

# Renderer wheels register here. The stdlib ANSI renderer is the default and
# ships zero-deps. External Rich/Textual renderer wheels will register here to
# replace or augment the built-in. The entry-point name is the renderer key
# used to select it at runtime (e.g. "ansi", "rich", "textual").
[project.entry-points."convertible.renderers"]
ansi = "convertible.tui.render.ansi:render"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convertible"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    # The [otel] extra, installed in dev/CI so the telemetry tests run. The base
    # package keeps zero runtime deps; this only affects the dev environment.
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
]

[tool.coverage.run]
source = ["convertible"]
omit = ["convertible/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=convertible (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["convertible"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
